      }

      right.innerHTML = `<div class="card"><div class="ct">HUESOS <span class="badge">${sel.length}</span></div><div class="view"><svg height="310" viewBox="0 0 1239 2357"><image href="${IMG}" width="1239" height="2357"/>
${LINKS.map(([a, b]) => `<line class="b" x1="${BONES[a][0]}" y1="${BONES[a][1]}" x2="${BONES[b][0]}" y2="${BONES[b][1]}"/>`).join("")}

</svg><small>TOCA UN HUESO DEL MUÑECO</small></div>

    }
    function aimRender() { renderTabs(); renderLeft(); renderRight() }
    /* ================= VISUAL ESP ================= */
    let page = "aim", ecur = "Jugadores";
    const ET = [["NOMBRE", "Player"], ["ETIQUETA", "[TAG]"], ["DISTANCIA", "123m"], ["K/D", "K/D 1.54"], ["RANGO", "Oro II"], ["PRESTIGE", "Prestige 3"], ["ESCUADRA", "TRIO (3)"], ["ID EQUIPO", "TEAM ID: 2"], ["ARMA", "AK47", "#5aa9ff"], ["TEXTO PLAT.", "Steam"], ["NIVEL", "Level: 20"], ["BAJAS", "Kills: 4"], ["PING", "35ms"], ["NOQUEADO", "Knocked", "#ffa040"], ["HP TEXTO", "54%"], ["RESPAWN", "Respawn 18s", "#ffb347"]];
    const EI = [["ICONO PLAT.", "🎮"], ["ICONO ARMA", "🔫"], ["ICONO BOT", "🤖"], ["INPUT", "⌨️"]];
    const EV = ["CAJA", "ESQUELETO", "BARRA DE VIDA"];
    const ALL = [...ET.map(x => x[0]), ...EI.map(x => x[0]), ...EV];
    const sw = (k, l, s, v) => ({ t: "sw", k, l, s, v }), sl = (k, l, s, v, min, max, u, st = 1) => ({ t: "sl", k, l, s, v, min, max, u, st }), seg = (k, l, s, o, v) => ({ t: "seg", k, l, s, o, v }), col = (k, l, s, v) => ({ t: "col", k, l, s, v }), col2 = (k, l, s, v) => ({ t: "col2", k, l, s, v });

    const caja = (c = 1) => ({ t: "CAJA", rows: [seg("box", "Estilo de caja", "Esquinas, 2D o 3D", BX, "Esquinas"), sl("bt", "Grosor", "Borde del rectángulo", 1, 1, 5, ""), sl("st", "Grosor del esqueleto", "Huesos del ESP", 1, 1, 5, ""), ...(c ? [col("cv", "Color visible", "Enemigo a la vista", "#2ecc40"), col("ci", "Color invisible", "Enemigo tras pared", "#ff0000"), col("ck", "Color noqueado", "Enemigo derribado", "#ff8c00")] : [])] });
    const textos = () => ({ t: "TEXTOS", rows: [sl("ts", "Tamaño de texto", "Se aplica a todos los textos", 9, 6, 20, ""), sl("is", "Tamaño de iconos", "Se aplica a todos los iconos", 15, 8, 30, ""), sw("to", "Contorno del texto", "Mejora la lectura", 1), sl("tw", "Grosor del contorno", "Borde de los textos", 1.5, .5, 3, "", .5), col("tc", "Color de texto", "Se aplica a todos los textos", "#ffffff")] });

    const info = n => ({ t: n.toUpperCase(), d: 'Para añadir jugadores a tu lista ve a la pestaña <u style="color:var(--acc2)">lista de jugadores</u> y haz clic derecho sobre ellos.', btn: "Ver lista de " + n.toLowerCase() });
    const ETABS = {
      Jugadores: {
        cards: [{ t: "GENERAL", rows: [sw("esp", "ESP activado", "Dibuja el ESP en la partida", 1), sl("dist", "Distancia máxima", "Distancia a la que deja de dibujarse", 300, 10, 1000, " m")] }, caja(), textos(), extras(),
        { t: "OUTLINE", gate: 1, rows: [sw("oon", "Activar Outline ESP", "Activa el contorno del ESP", 0), sl("od", "Distancia máxima", "", 150, 10, 500, " m"), sl("ow", "Grosor del contorno", "", .5, .5, 5, "", .5), col2("oc", "Color visible / invisible", "", ["#2ecc40", "#ff0000"])] },
        { t: "CHAMS", gate: 1, rows: [sw("con", "Activar Chams", "Activa el Chams", 0), sl("cd", "Distancia máxima", "", 500, 10, 1000, " m"), seg("cm", "Modo visible / invisible", "", ["Plano", "Sombreado", "Metálico", "Wireframe"], "Sombreado"), sl("cw", "Detalle del wireframe", "", 100, 0, 100, " %"), col2("cc", "Color visible / invisible", "", ["#a855f7", "#ff3b6b"])] }], def: ["NOMBRE", "ETIQUETA", "DISTANCIA", "ESCUADRA", "ID EQUIPO", "TEXTO PLAT.", "RESPAWN", "ICONO PLAT.", "ICONO BOT", "ESQUELETO", "BARRA DE VIDA"], dpos: { "NOMBRE": "top-1", "ETIQUETA": "top-1", "TEXTO PLAT.": "top-1", "ICONO PLAT.": "top-2", "ICONO BOT": "top-2", "ID EQUIPO": "right-1", "BARRA DE VIDA": "left-0" }
      },

        { t: "NPCS", rows: [sw("snap", "Líneas", "Línea del NPC al suelo", 0), seg("lo", "Tipo de línea", "Desde dónde empieza", LO, "Arriba")] },
        { t: "COLORES", rows: [col("cv", "Color caja", "Color de la caja del NPC", "#ff8c00"), col("cb", "Color huesos", "Color de los huesos del NPC", "#38bdf8")] }], def: ["CAJA", "ESQUELETO", "NOMBRE", "DISTANCIA"]

        if (e.classList.contains("sw")) e.onclick = () => { o.v = !o.v; espLeft(); RR() };

    }

    /* ================= PERFILES / AJUSTES ================= */
    function toast(t) { let e = document.getElementById("toast"); if (!e) { e = document.createElement("div"); e.id = "toast"; document.body.appendChild(e) } e.textContent = t; e.className = "show"; clearTimeout(e._t); e._t = setTimeout(() => e.className = "", 1800) }
    function grabKey(cb) { toast("Pulsa una tecla o botón… (Esc borra)"); const h = ev => { ev.preventDefault(); removeEventListener("keydown", h, true); removeEventListener("mousedown", h, true); cb(ev.key == "Escape" ? "–" : ev.key ? (ev.key == " " ? "SPACE" : ev.key.toUpperCase()) : ["MOUSE1", "MOUSE3", "MOUSE2", "MOUSE4", "MOUSE5"][ev.button]) }; setTimeout(() => { addEventListener("keydown", h, true); addEventListener("mousedown", h, true) }, 60) }
    const code = () => Math.random().toString(16).slice(2, 12).toUpperCase();
    const PR = {
      tab: "mine", active: "Default", mine: [{ n: "Default", k: "–" }, { n: "LEGIT HYPER SERVICES MW4", k: "–" }], q: "", sort: "Más recientes", imp: "",
      com: [{ n: "LEGIT HYPER SERVICES MW4", a: "Mío", up: 0, dn: 0, dl: 1, c: "D7C263C4DF", t: 4 }, { n: "DMZ HYPER SERVICES", a: "Mío", up: 0, dn: 0, dl: 0, c: "C1E21B1FE5", t: 3 }, { n: "RAGE HYPER SERVICES", a: "Mío", up: 0, dn: 0, dl: 0, c: "03DF0AA5FE", t: 2 }, { n: "MEDIA HYPER SERVICES MW4", a: "Mío", up: 0, dn: 0, dl: 0, c: "AAEAEAD952", t: 1 }, { n: "Closet Pro WZ", a: "xNightWolf", up: 12, dn: 2, dl: 48, c: "9F31B0C2AA", t: 0 }]
    };
    function profiles() {
      tabs.innerHTML = ""; right.innerHTML = "";
      const sw2 = `<div class="seg big"><span class="${PR.tab == "mine" ? 'on' : ''}" data-pt="mine">👤 Mis perfiles</span><span class="${PR.tab == "com" ? 'on' : ''}" data-pt="com">👥 Comunidad</span></div>`;
      if (PR.tab == "mine") {
        left.innerHTML = sw2 + `<div class="card cur"><div class="fold">📂</div><div><div class="ct" style="letter-spacing:0;margin:0">Perfil actual</div><h2>${PR.active.toUpperCase()}</h2><div class="desc" style="margin:0">Perfil seleccionado ahora mismo</div></div>
  <div class="acts"><button class="obtn" id="pl">⤓ Cargar</button><button class="obtn" id="pk">⌨ Asignar tecla</button><button class="obtn" id="ps">⇪ Compartir</button><button class="btn" id="pg" style="margin:0">💾 Guardar</button><button class="obtn red" id="pr">↺ Restablecer</button></div></div>
  <div class="card"><div style="display:flex;align-items:flex-start"><div><div class="ct">MIS PERFILES</div><div class="desc">Tus perfiles guardados · clic para activarlo</div></div><button class="btn" id="pn" style="margin-left:auto">＋ Nuevo perfil</button></div>
  ${PR.mine.map((p, i) => `<div class="prow ${p.n == PR.active ? 'act' : ''}" data-i="${i}"><span class="star">★</span><b>${p.n}</b><span class="kb">⌨ ${p.k}</span><span class="st ${p.n == PR.active ? 'ok' : ''}">${p.n == PR.active ? "ACTIVO" : "GUARDADO"}</span><span class="ib" data-a="k">⌨</span><span class="ib" data-a="s">⇪</span><span class="ib" data-a="d">🗑</span></div>`).join("")}</div>`;
        const cur = () => PR.mine.find(p => p.n == PR.active);
        pl.onclick = () => toast(`Perfil "${PR.active}" cargado`); pk.onclick = () => grabKey(k => { cur().k = k; profiles(); toast("Tecla asignada: " + k) });
        const share = p => { let e = PR.com.find(c => c.n == p.n); if (!e) { e = { n: p.n, a: "Mío", up: 0, dn: 0, dl: 0, c: code(), t: Date.now() }; PR.com.push(e) } navigator.clipboard?.writeText(e.c); toast("Código copiado: " + e.c) };
        ps.onclick = () => share(cur()); pg.onclick = () => toast("Perfil guardado"); pr.onclick = () => { if (confirm("¿Restablecer el perfil actual a los valores por defecto?")) toast("Perfil restablecido") };
        pn.onclick = () => { const n = prompt("Nombre del nuevo perfil:"); if (n && n.trim()) { PR.mine.push({ n: n.trim(), k: "–" }); profiles() } };
        left.querySelectorAll(".prow").forEach(r => {
          const p = PR.mine[r.dataset.i]; r.onclick = ev => {
            const a = ev.target.dataset.a;
            if (a == "k") grabKey(k => { p.k = k; profiles() }); else if (a == "s") share(p); else if (a == "d") { if (p.n == PR.active) return toast("No puedes borrar el perfil activo"); if (confirm(`¿Borrar "${p.n}"?`)) { PR.mine.splice(r.dataset.i, 1); profiles() } } else { PR.active = p.n; profiles(); toast(`Perfil "${p.n}" activado`) }
          }
        })
      }
      else {
        let l = PR.com.filter(c => c.n.toLowerCase().includes(PR.q.toLowerCase())); l.sort(PR.sort == "Más votados" ? (a, b) => (b.up - b.dn) - (a.up - a.dn) : PR.sort == "Más descargados" ? (a, b) => b.dl - a.dl : (a, b) => b.t - a.t);
        left.innerHTML = sw2 + `<div class="card"><div style="display:flex;gap:8px;align-items:flex-start"><div><div class="ct">COMUNIDAD</div><div class="desc">Perfiles compartidos por otros jugadores</div><div class="desc">Pulsa 👍 o 👎 para votar</div></div><input class="srch" id="cq" style="margin-left:auto" placeholder="🔍 Buscar perfil..." value="${PR.q}"><select id="cs" style="width:160px">${["Más recientes", "Más votados", "Más descargados"].map(x => `<option ${x == PR.sort ? 'selected' : ''}>${x}</option>`).join("")}</select></div>
  <div class="prow" style="cursor:default"><span class="star">&lt;/&gt;</span><div><b>Importar perfil</b><div class="desc" style="margin:0">Pega el código de un perfil para añadirlo</div></div><input class="srch" id="ic" style="margin-left:auto;width:340px" placeholder="Pega el código del perfil..." value="${PR.imp}"><button class="btn" id="ib" style="margin:0">☁ Importar</button></div>
  ${l.map(c => `<div class="prow" data-c="${c.c}" style="cursor:default"><span class="star">📄</span><div><b>${c.n}</b><div class="desc" style="margin:0">${c.a}</div></div><span style="margin-left:auto" class="ib ${c.v == 1 ? 'von' : ''}" data-a="up">👍</span><b>${c.up - c.dn}</b><span class="ib ${c.v == -1 ? 'von' : ''}" data-a="dn">👎</span><span class="desc" style="margin:0 6px">⤓ ${c.dl}</span><code class="cd">${c.c}</code>${c.a == "Mío" ? '<span class="ib" data-a="del">🗑</span>' : ''}<span class="ib" data-a="dl">⤓</span></div>`).join("") || '<div class="empty"><b>Sin resultados</b></div>'}</div>`;
        cq.oninput = () => { PR.q = cq.value; profiles(); const n = document.getElementById("cq"); n.focus(); n.setSelectionRange(99, 99) }; cs.onchange = () => { PR.sort = cs.value; profiles() }; ic.oninput = () => PR.imp = ic.value;
        const add = c => { let n = c.n; while (PR.mine.some(p => p.n == n)) n += " (2)"; PR.mine.push({ n, k: "–" }); c.dl++; toast(`"${n}" añadido a Mis perfiles`) };
        ib.onclick = () => { const v = PR.imp.trim().toUpperCase(); if (!v) return toast("Pega un código primero"); const c = PR.com.find(x => x.c == v); c ? add(c) : (PR.mine.push({ n: "Importado " + v.slice(0, 6), k: "–" }), toast("Perfil importado")); PR.imp = ""; profiles() };
        left.querySelectorAll("[data-c]").forEach(r => {
          const c = PR.com.find(x => x.c == r.dataset.c); r.onclick = ev => {
            const a = ev.target.dataset.a; if (!a) return;
            if (a == "up" || a == "dn") { const v = a == "up" ? 1 : -1; if (c.v == 1) c.up--; if (c.v == -1) c.dn--; c.v = c.v == v ? 0 : v; if (c.v == 1) c.up++; if (c.v == -1) c.dn++ }
            else if (a == "del") { if (!confirm(`¿Quitar "${c.n}" de la comunidad?`)) return; PR.com.splice(PR.com.indexOf(c), 1) } else if (a == "dl") add(c); profiles()
          }
        })
      }
      left.querySelectorAll("[data-pt]").forEach(e => e.onclick = () => { PR.tab = e.dataset.pt; profiles() })
    }
    const AJ = { tab: "Ajustes", font: "arialbd", notif: "Arriba izquierda", hm: 0, menu: "INSERT", mirror: 0, ov: "Borderless", mon: "Monitor 1", vs: 0, fps: 0, dev: "MAKCU", con: "CONECTADO", dbg: 1 };
    function settings() {
      tabs.innerHTML = ["Ajustes", "Dispositivo"].map(n => `<div class="tab ${n == AJ.tab ? 'on' : ''}" data-n="${n}"><i></i>${n}</div>`).join("");
      tabs.querySelectorAll(".tab").forEach(e => e.onclick = () => { AJ.tab = e.dataset.n; settings() });
      const R = (l, s, c) => `<div class="row"><div class="lb"><b>${l}</b><span>${s}</span></div>${c}</div>`, ck = k => `<div class="chk ${AJ[k] ? 'on' : ''}" data-ck="${k}">${AJ[k] ? '✓' : ''}</div>`, sel = (k, o) => `<select data-sel="${k}">${o.map(x => `<option ${x == AJ[k] ? 'selected' : ''}>${x}</option>`).join("")}</select>`;
      if (AJ.tab == "Ajustes") {
        left.innerHTML = `<div class="card"><div class="ct">INTERFAZ</div>${R("Nombre de fuente", "Fuente instalada en la 2PC", `<input class="srch" data-in="font" value="${AJ.font}" style="width:180px">`)}${R("Posición de notificaciones", "Dónde aparecen los mensajes", sel("notif", ["Arriba izquierda", "Arriba derecha", "Abajo izquierda", "Abajo derecha"]))}</div>
  <div class="card"><div class="ct">GENERAL</div>${R("Ocultar mouse", "Oculta el cursor", ck("hm"))}${R("Tecla del menú", "Mostrar / ocultar", `<button class="obtn" id="mk">${AJ.menu}</button>`)}${R("Espejo del mouse", "Espejo del mouse principal", ck("mirror"))}</div>`;
        right.innerHTML = `<div class="card"><div class="ct">PANTALLA</div>${R("Modo overlay", "Ventana del overlay", sel("ov", ["Borderless", "Ventana", "Pantalla completa"]))}${R("Monitor", "Pantalla del overlay", sel("mon", ["Monitor 1", "Monitor 2"]))}${R("VSync", "Sincroniza con el monitor", ck("vs"))}${R("Límite FPS", "Tope de frames. 0 = sin límite", `<div class="sl"><input type="range" min="0" max="360" step="10" value="${AJ.fps}" id="fps"><em>${AJ.fps || "∞"}</em></div>`)}</div>
  <div class="card"><div class="ct">APLICACIÓN</div>${R("Reload Loader", "Borra cache y recarga", `<button class="obtn" id="rl">Recargar</button>`)}${R("Salir de la aplicación", "Cierra el cheat y todo", `<button class="obtn red" id="ex">Salir</button>`)}${R("Versión", "Call Of Duty · DMA", `<span class="badge">V2.0.0</span>`)}</div>`;
        mk.onclick = () => grabKey(k => { AJ.menu = k; settings() }); fps.oninput = () => { AJ.fps = +fps.value; fps.nextElementSibling.textContent = AJ.fps || "∞" };
        rl.onclick = () => { toast("Recargando loader…"); setTimeout(() => location.reload(), 900) }; ex.onclick = () => { if (confirm("¿Salir de la aplicación?")) toast("Cerrando…") }
      }
      else {
        const okc = AJ.con == "CONECTADO"; left.innerHTML = `<div class="card"><div class="ct">DISPOSITIVO</div>${R("Dispositivo", "MAKCU / KMBox / Ferrum", `<span class="st">${AJ.dev.toUpperCase()}</span>`)}${R("Estado", "Conexión actual", `<span class="st ${okc ? 'ok' : AJ.con == "CONECTANDO…" ? 'wait' : 'bad'}">${AJ.con}</span>`)}</div>
  <div class="card"><div class="ct">DISPOSITIVO</div>${R("Dispositivo de entrada", "Elige el dispositivo y pulsa Conectar. Queda guardado en el perfil y en el siguiente arranque se reconecta solo.", `<select id="dv">${["MAKCU", "KMBox Net", "KMBox B+", "Ferrum"].map(x => `<option>${x}</option>`).join("")}</select>`)}<button class="btn" id="cn" style="margin-top:12px">Conectar dispositivo</button></div>`;
        right.innerHTML = `<div class="card"><div class="ct">DEBUG</div>${R("Debug", "HUD de debug", ck("dbg"))}${R("Test Move", "Prueba de movimiento del dispositivo", `<button class="obtn" id="tm">Test Move</button>`)}${R("Test Click", "Prueba de clics del dispositivo", `<button class="obtn" id="tc">Test Click</button>`)}</div>`;
        dv.value = AJ.dev; const bad = () => { if (AJ.con != "CONECTADO") { toast("Conecta un dispositivo primero"); return 1 } };
        cn.onclick = () => { AJ.dev = dv.value; AJ.con = "CONECTANDO…"; settings(); setTimeout(() => { AJ.con = "CONECTADO"; devpill.textContent = AJ.dev.toUpperCase(); if (page == "set") settings(); toast(AJ.dev + " conectado") }, 1200) };
        tm.onclick = () => bad() || toast("Movimiento de prueba enviado"); tc.onclick = () => bad() || toast("Clic de prueba enviado")
      }
      document.querySelectorAll("[data-ck]").forEach(e => e.onclick = () => { AJ[e.dataset.ck] ^= 1; settings() });
      document.querySelectorAll("[data-sel]").forEach(e => e.onchange = () => AJ[e.dataset.sel] = e.value);
      document.querySelectorAll("[data-in]").forEach(e => e.oninput = () => AJ[e.dataset.in] = e.value)
    }

    const PAGES = { prof: ["Perfiles", "Guarda y carga configuraciones."], set: ["Ajustes", "Interfaz, pantalla, dispositivo y aplicación."], world: ["ESP del mundo", "Objetos del mapa: contenedores, granadas, plantas, items del suelo y puntos de extracción."], radar: ["Radar", "Mini-mapa 2D con los jugadores."], wradar: ["Web radar", "Comparte el radar de tu partida con otros usuarios."], list: ["Player List", "Lista de jugadores detectados: plataforma, estado, equipo y distancia."], aim: ["Aimbot", "Configuración general del apuntado."], esp: ["Visual ESP", "Elige qué se dibuja sobre cada jugador y colócalo arrastrando al preview."] };
    function render() {
      document.querySelectorAll(".nav").forEach(n => n.classList.toggle("on", n.dataset.p == page));
      const P = PAGES[page] || [document.querySelector(`.nav[data-p="${page}"]`).textContent.trim(), "Sección en construcción."]; ptitle.textContent = P[0]; psub.textContent = P[1];
      const G = document.querySelector(".grid"); G.style.gridTemplateColumns = page == "list" || page == "prof" ? "1fr" : page == "wradar" || page == "set" ? "1fr 1fr" : "";
      if (page == "aim") aimRender(); else if (page == "radar") { radarTabs(); espLeft(); radarRight() } else if (page == "wradar") webRadar(); else if (page == "list") playerList(); else if (page == "prof") profiles(); else if (page == "set") settings(); else if (page == "world") { worldTabs(); WTABS[wcur].sel ? selLeft() : espLeft(); worldRight() } else if (page == "esp") { espTabs(); espLeft(); espRight() } else { tabs.innerHTML = ""; left.innerHTML = '<div class="card"><div class="desc">Próximamente.</div></div>'; right.innerHTML = "" }
    }
    document.querySelectorAll(".nav").forEach(n => n.onclick = () => { page = n.dataset.p; render() });
    render();

  </script>
</body>

</html>
